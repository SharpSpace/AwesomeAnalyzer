name: Release and Publish to Marketplace

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, create release and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore "AwesomeAnalyzer.sln"

      - name: Build solution (Release)
        run: dotnet msbuild "AwesomeAnalyzer.sln" -t:Rebuild -p:Configuration=Release -p:DeployExtension=false

      - name: Find and copy VSIX to Setup folder
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path . -Filter *.vsix -Recurse -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vsix) { Write-Error "No .vsix found in repository after build."; exit 1 }
          New-Item -ItemType Directory -Path Setup -Force | Out-Null
          Copy-Item -Path $vsix.FullName -Destination (Join-Path -Path "Setup" -ChildPath $vsix.Name) -Force
          Write-Host "Copied VSIX to Setup\$($vsix.Name)"

      - name: Create release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "# Release $tag`n`nAutomated release generated by GitHub Actions.`n"
          Set-Content -Path Setup/release-notes.md -Value $notes -Encoding UTF8

      - name: Create GitHub release and upload Setup contents
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: Setup/*
          allowUpdates: true
          replacesArtifacts: true

      - name: Publish to Visual Studio Marketplace
        if: ${{ secrets.MARKETPLACE_PAT != '' && secrets.MARKETPLACE_PUBLISHER != '' }}
        shell: pwsh
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
          MARKETPLACE_PUBLISHER: ${{ secrets.MARKETPLACE_PUBLISHER }}
        run: |
          # Get the VSIX file
          $vsix = Get-ChildItem -Path Setup -Filter *.vsix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vsix) {
            Write-Host "No VSIX found in Setup/ - skipping marketplace publish."
            exit 0
          }

          Write-Host "Publishing $($vsix.Name) to Visual Studio Marketplace..."

          # Check if Node.js is installed
          $nodeVersion = node --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Node.js is not installed. TFX CLI requires Node.js."
            exit 1
          }
          Write-Host "Node.js version: $nodeVersion"

          # Check if tfx-cli is installed, install if needed
          $tfxVersion = tfx version 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "TFX CLI not found. Installing tfx-cli..."
            npm install -g tfx-cli
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to install tfx-cli"
              exit 1
            }
          }

          # Publish extension
          & tfx extension publish --vsix "$($vsix.FullName)" --token "$env:MARKETPLACE_PAT" --no-prompt

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Extension published successfully!"
          } else {
            Write-Error "Failed to publish extension. Exit code: $LASTEXITCODE"
            Write-Host ""
            Write-Host "Troubleshooting:"
            Write-Host "1. Verify PAT token has 'Marketplace (Publish)' scope"
            Write-Host "2. Verify publisher '$env:MARKETPLACE_PUBLISHER' exists"
            exit 1
          }
