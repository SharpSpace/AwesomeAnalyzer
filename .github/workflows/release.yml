name: Release and Publish to Marketplace

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*.[0-9]*'

jobs:
  build-and-release:
    name: Build, create release and publish
    runs-on: windows-latest
    permissions:
      contents: write
    # Prevent overlapping release runs for the same repository
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v?(?<version>\d+(\.\d+){2,3})$') {
            Write-Error "Release workflow requires a version tag like v1.2.3 or 1.2.3. Received '$tag'."
            exit 1
          }
          $version = $Matches.version
          Write-Host "Using tag: $tag -> version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update VSIX manifest version
        # The manifest in the repo keeps Version="0.0.0" as a placeholder.
        # This step injects the real version at build time; no commit back is needed.
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $path = "AwesomeAnalyzer/AwesomeAnalyzer.Vsix/source.extension.vsixmanifest"
          [xml]$manifest = Get-Content $path
          $manifest.PackageManifest.Metadata.Identity.Version = $version
          $manifest.Save([System.IO.Path]::GetFullPath($path))
          Write-Host "Set VSIX manifest version to $version"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore "AwesomeAnalyzer.sln"

      - name: Build solution (Release)
        run: dotnet msbuild "AwesomeAnalyzer.sln" -t:Rebuild -p:Configuration=Release -p:DeployExtension=false

      - name: Find and copy VSIX to Setup folder
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # Exclude the Setup folder to avoid picking up old committed VSIX files
          $vsix = Get-ChildItem -Path . -Filter *.vsix -Recurse -File |
            Where-Object { $_.FullName -notlike "*\Setup\*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $vsix) { Write-Error "No .vsix found in repository after build."; exit 1 }
          New-Item -ItemType Directory -Path Setup -Force | Out-Null
          $destName = "AwesomeAnalyzer.$version.vsix"
          Copy-Item -Path $vsix.FullName -Destination (Join-Path -Path "Setup" -ChildPath $destName) -Force
          Write-Host "Copied VSIX to Setup\$destName"

      - name: Create GitHub release and upload VSIX
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          artifacts: Setup/*.vsix
          allowUpdates: true
          generateReleaseNotes: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        shell: pwsh
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MARKETPLACE_PAT)) {
            Write-Host "MARKETPLACE_PAT is not configured - skipping marketplace publish."
            exit 0
          }
          $vsix = Get-ChildItem -Path Setup -Filter *.vsix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vsix) {
            Write-Host "No VSIX found in Setup/ - skipping marketplace publish."
            exit 0
          }
          Write-Host "Publishing $($vsix.Name) to Visual Studio Marketplace..."
          $tfxCommand = Get-Command tfx -ErrorAction SilentlyContinue
          if (-not $tfxCommand) {
            Write-Host "tfx-cli is not available on PATH. Installing..."
            npm install -g tfx-cli
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to install tfx-cli"
              exit 1
            }
            $npmGlobalBin = (npm bin -g).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($npmGlobalBin)) {
              Write-Error "Failed to resolve npm global bin path after tfx-cli installation."
              exit 1
            }
            $env:PATH = "$npmGlobalBin$([System.IO.Path]::PathSeparator)$env:PATH"
            $tfxCommand = Get-Command tfx -ErrorAction SilentlyContinue
            if (-not $tfxCommand) {
              Write-Error "tfx-cli was installed but 'tfx' could not be resolved from PATH."
              exit 1
            }
            $tfxPath = $tfxCommand.Source
          } else {
            $tfxPath = $tfxCommand.Source
          }
          & $tfxPath extension publish --vsix "$($vsix.FullName)" --token "$env:MARKETPLACE_PAT" --no-prompt
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Extension published successfully!"
          } else {
            Write-Error "Failed to publish extension (exit code: $LASTEXITCODE). Verify PAT has 'Marketplace (Publish)' scope."
            exit 1
          }
