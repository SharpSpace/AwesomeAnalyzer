name: Release and Publish to Marketplace

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    name: Build, create release and publish
    runs-on: windows-latest
    permissions:
      contents: write
    # Prevent concurrent release runs to avoid duplicate version tags
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: version
        shell: pwsh
        run: |
          # Version format: YYYY.MMDD.HHmmss  (e.g. 2026.0514.082547)
          # Unique per second, always increasing, human-readable, fits X.Y.Z.
          $now        = [System.DateTime]::UtcNow
          $year       = $now.Year
          $monthDay   = [int]($now.ToString('MMdd'))
          $timeNum    = [int]($now.ToString('HHmmss'))
          $newVersion = "$year.$monthDay.$timeNum"
          $newTag     = "v$newVersion"
          Write-Host "New version: $newVersion  ->  tag: $newTag"
          "version=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$newTag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update VSIX manifest version
        # The manifest in the repo keeps Version="0.0.0" as a placeholder.
        # This step injects the real version at build time; no commit back is needed.
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $path = "AwesomeAnalyzer/AwesomeAnalyzer.Vsix/source.extension.vsixmanifest"
          [xml]$manifest = Get-Content $path
          $manifest.PackageManifest.Metadata.Identity.Version = $version
          $manifest.Save([System.IO.Path]::GetFullPath($path))
          Write-Host "Set VSIX manifest version to $version"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore "AwesomeAnalyzer.sln"

      - name: Build solution (Release)
        run: dotnet msbuild "AwesomeAnalyzer.sln" -t:Rebuild -p:Configuration=Release -p:DeployExtension=false

      - name: Find and copy VSIX to Setup folder
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # Exclude the Setup folder to avoid picking up old committed VSIX files
          $vsix = Get-ChildItem -Path . -Filter *.vsix -Recurse -File |
            Where-Object { $_.FullName -notlike "*\Setup\*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $vsix) { Write-Error "No .vsix found in repository after build."; exit 1 }
          New-Item -ItemType Directory -Path Setup -Force | Out-Null
          $destName = "AwesomeAnalyzer.$version.vsix"
          Copy-Item -Path $vsix.FullName -Destination (Join-Path -Path "Setup" -ChildPath $destName) -Force
          Write-Host "Copied VSIX to Setup\$destName"

      - name: Create and push git tag
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          Write-Host "Created and pushed tag $tag"

      - name: Create GitHub release and upload VSIX
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          artifacts: Setup/*.vsix
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        if: ${{ secrets.MARKETPLACE_PAT != '' }}
        shell: pwsh
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          $vsix = Get-ChildItem -Path Setup -Filter *.vsix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vsix) {
            Write-Host "No VSIX found in Setup/ - skipping marketplace publish."
            exit 0
          }
          Write-Host "Publishing $($vsix.Name) to Visual Studio Marketplace..."
          $tfxVersion = tfx version 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Installing tfx-cli..."
            npm install -g tfx-cli
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to install tfx-cli"
              exit 1
            }
          }
          & tfx extension publish --vsix "$($vsix.FullName)" --token "$env:MARKETPLACE_PAT" --no-prompt
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Extension published successfully!"
          } else {
            Write-Error "Failed to publish extension (exit code: $LASTEXITCODE). Verify PAT has 'Marketplace (Publish)' scope."
            exit 1
          }
